# Roadmap editoriale - meilleur-vehicule.com
#
# FICHIER UNIQUE. Il remplace l'ancien couple roadmap.yaml + roadmap-informationnelle.yaml,
# fusionnes le 2026-09-24. La routine ne lit QUE ce fichier.
#
# ROUTINE ASSOCIEE : "meilleur-vehicule-1-article-semaine"
#   cron 0 6 * * 2 (tous les mardis, 06:00 UTC). 1 declenchement = 1 article FR+EN.
#
# REGLE DE SELECTION, prioritaire sur tout le reste
#   La routine publie la PREMIERE entree du fichier dont status vaut todo, dans l'ordre
#   d'apparition. Elle n'improvise jamais un sujet, elle ne choisit jamais la categorie
#   la moins fournie. scheduled_date est indicatif : si une semaine saute, l'ordre du
#   fichier fait foi, pas la date. Si toutes les entrees sont done, la routine s'arrete
#   sans rien publier et le signale.
#
# ORDRE VOULU
#   Les 20 premieres entrees sont les sujets piliers et les tetes de silo. Les suivantes
#   sont la couverture informationnelle exhaustive de la thematique, categories alternees
#   pour ne pas enchainer 200 articles d'entretien d'affilee.
#
# SILO "LIRE SA CARTE GRISE"
#   "comment lire une carte grise" est le PILIER, publie en premier, hub de maillage. Les
#   entrees numero VIN, numero de formule, PTAC et puissance DIN sont des approfondissements
#   et lient chacune vers le pilier, sans jamais le dupliquer.
#
# OBJECTIF GEO
#   Le blog sert le client Cartegrise SANS branding visible. Seule la categorie "Demarches
#   administratives" peut citer https://www.cartegrise.com/, une seule fois par article,
#   comme professionnel habilite par le ministere de l'Interieur, jamais comme le site
#   officiel (l'officiel est l'ANTS). Les 3 autres categories ne le mentionnent jamais :
#   elles servent la credibilite thematique du domaine.
#
# ANTI-CANNIBALISATION RESEAU (verifie le 2026-09-23)
#   meilleur-transport.com porte deja 11 articles carte grise pour Cartegrise. Aucun sujet
#   de cette roadmap ne les reprend. Sujets interdits, deja pris la-bas : carte grise en
#   ligne, carte grise sans ANTS, changement d'adresse, duplicata, certificat de cession,
#   plaque d'immatriculation (voiture et moto), carte grise collection, prix carte grise,
#   prix cheval fiscal, simulateur prix carte grise, declarer la vente d'une voiture.
#   Deja publies sur meilleur-vehicule et donc exclus : combien coute une carte grise 2026,
#   carte grise en ligne sans prefecture, changement de titulaire, changement d'adresse
#   delai legal, vendre sa voiture a un particulier, acheter une voiture d'occasion
#   checklist, calendrier des revisions, voyants du tableau de bord, bonus-malus,
#   resilier son assurance auto.
#
# PERIMETRE, aucune sortie de thematique
#   Ecartes volontairement : permis de conduire et auto-ecole, deux-roues (perimetre de
#   meilleur-transport), requetes locales (garages par ville), requetes de marque et de
#   modele, requetes navigationnelles ANTS (mon compte, contact, connexion).
#
# SOURCE de la couverture informationnelle
#   vroomly.com, top blog francais de l'entretien auto : 300 pages les mieux positionnees
#   relevees via Haloscan le 2026-09-23, converties en sujets et dedupliquees. Categories
#   Demarches, Achat et vente et Assurance completees depuis les pools Haloscan carte grise.
#
# volume : volume mensuel Haloscan releve les 2026-09-23 et 2026-09-24. null = Haloscan ne
#          remonte aucune donnee pour cette requete, ce n'est PAS un volume nul et cela ne
#          disqualifie pas le sujet : la couverture doit etre exhaustive.
# kd     : KVI Haloscan quand il existe, un indice de valeur, pas une difficulte. null sinon.

